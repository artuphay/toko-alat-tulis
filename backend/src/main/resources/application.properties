spring.application.name=backend
server.port=${PORT:8080}
# Hormati header X-Forwarded-* dari proxy hosting agar URL gambar memakai https
server.forward-headers-strategy=framework

# Database: H2 in-memory untuk lokal. Di hosting, set DATABASE_URL
# (format postgres://user:pass@host/db) dan BackendApplication akan memakai PostgreSQL.
spring.datasource.url=jdbc:h2:mem:tokodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE:false}

# Upload foto produk
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Password panel admin. Jika kosong, password acak dibuat dan dicetak di log saat start.
admin.password=${ADMIN_PASSWORD:}

# Logging
spring.jpa.show-sql=${SHOW_SQL:false}

# QRIS statis Kima Fashion and Accessories (isi QR pada poster QRIS). Dipakai untuk membuat
# QRIS dinamis berisi nominal tiap pesanan. Bisa diganti lewat env KIMA_QRIS_STATIC_PAYLOAD.
kima.qris.static-payload=${KIMA_QRIS_STATIC_PAYLOAD:00020101021126740022ID.CO.POSINDONESIA.WWW011893608161000009738702150000000000814900303UMI51440014ID.CO.QRIS.WWW0215ID10265153730780303UMI5204565153033605802ID5925Kima Fashion and Accessor6005bogor61051611062070703A016304B76A}
